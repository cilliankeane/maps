const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ll=[];
rows.forEach((p)=>{
  ll.push([p.lat,p.lng]);
  const col=colours[p.cat]||'#555';
  const big=(p.cat==='stay');
  const size=big?30:24;
  const html=`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${col};border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font:700 ${big?12:10}px/1 Arial;color:#fff">${p.n}</div>`;
  const day=p.day?` ${esc(p.day)}`:'';
  const rate=p.rating?`<div class="pin-rate">★ ${p.rating} (${p.reviews})</div>`:'';
  L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html,iconSize:[size,size],iconAnchor:[size/2,size/2]})}).addTo(map)
   .bindPopup(`<div class="pin-cat">${esc(p.cat)} · ${esc(p.area)}${day}</div><div class="pin-title">${esc(p.name)}</div>`
     +`<div class="pin-addr">${esc(p.addr)}</div>${rate}`
     +`<a href="${esc(p.url)}" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px;padding:6px 12px;background:#4285F4;color:#fff;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600">📍 Open in Google Maps</a>`);
});
if(ll.length) map.fitBounds(ll,{padding:[40,40],maxZoom:11});
</script></body></html>
