<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Maps</title>
<style>
  :root{--bg:#0f1220;--card:#1a1e33;--accent:#4f7cff;--text:#e8eaf6;--muted:#9aa0b5}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px}
  header{text-align:center;margin-bottom:40px}
  h1{font-size:2rem;font-weight:700}
  .country{width:100%;max-width:960px;margin-bottom:30px}
  .country-title{font-size:1.2rem;font-weight:700;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .card{background:var(--card);border-radius:16px;padding:26px;text-decoration:none;color:var(--text);
    border:1px solid rgba(255,255,255,.06);transition:transform .15s ease,box-shadow .15s ease;display:block}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(79,124,255,.18)}
  .card h2{font-size:1.5rem;display:flex;align-items:center;gap:10px}
  .card .tag{font-size:.72rem;color:var(--accent);border:1px solid var(--accent);border-radius:20px;
    padding:2px 10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
</style>
</head>
<body>
  <header>
    <h1>🗺️ City Maps</h1>
  </header>

  <section class="country">
    <div class="country-title">Aus 🇦🇺</div>
    <div class="grid">
      <a class="card" href="hobart.html"><h2>🏔️ Hobart <span class="tag">TAS</span></h2></a>
      <a class="card" href="sydney.html"><h2>🍴 Sydney <span class="tag">NSW</span></h2></a>
    </div>
  </section>
</body>
</html>
